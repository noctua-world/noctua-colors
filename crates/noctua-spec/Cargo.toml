[package]
name = "noctua-spec"
description = "Parsing, defaults and validation for the noctua-colors specification format."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Internal to the compiler. The only publishable artifacts are the generated
# `noctua-colors-tokens` crate under dist/rust and the `noctua-colors` facade.
publish = false

[dependencies]
noctua-core.workspace = true
blake3.workspace = true
indexmap.workspace = true
miette = { workspace = true, features = ["fancy"] }
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

[lints]
workspace = true
