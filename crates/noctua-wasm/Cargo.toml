[package]
name = "noctua-wasm"
description = "Browser bindings over the noctua-colors engine, for the playground."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Internal to the compiler. The only publishable artifacts are the generated
# `noctua-colors-tokens` crate under dist/rust and the `noctua-colors` facade.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
noctua-check.workspace = true
noctua-core.workspace = true
noctua-emit.workspace = true
noctua-engine.workspace = true
noctua-spec.workspace = true
wasm-bindgen.workspace = true

[lints]
workspace = true
