# Magnitude.
# Three levels, as a traffic light. These are contexts, not the
# `magnitude` scale below: a badge reading `high` and a five-stop ordered
# scale are different things, and neither should have to be explained as
# the other.
high   = "danger"
medium = "warning"
low    = "success"

# Security and compliance.
# Posture and compliance. Unsigned and untrusted warn while breached and
# compromised alarm, which is the difference between unproven and known
# bad.
safe         = "success"
secure       = "success"
