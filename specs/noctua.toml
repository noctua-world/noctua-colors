spam      = "danger"

# Content and documents.
# Documents and their edit state. `stale` warns and `fresh` reads as live,
# which is the pair a cache has to be able to show.
created     = "success"
published   = "success"
duplicated  = "success"
edited      = "info"
modified    = "info"
renamed     = "info"
moved       = "info"
imported    = "info"
exported    = "info"
unchanged   = "neutral"
unpublished = "neutral"
deleted     = "neutral"
empty       = "neutral"
