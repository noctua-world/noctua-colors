# noctua-colors — the specification.
#
# This file is the only thing a developer edits. Everything under system/ is
# generated from it by `cargo xtask build` and must never be hand-edited.
#
# Every field below has a default, so anything you delete keeps working. The
# smallest useful spec is three lines:
#
#     [families.accent]
#     hue = 264
#
# Hues come from the existing fleet palette, measured rather than copied: the
# ochre that noctua-hub and noctua-shell already use sits at hue 59.3 with
# about 61% of the chroma sRGB allows there. Recording the hue and letting the
# curves regenerate the rest is the entire point of this project — the two
# projects had already drifted apart on five of thirteen shared tokens.

# --- The colour system's identity ----------------------------------------
#
# This repository publishes two things on two clocks, and this table is the
# one people install.
#
#   * The colour system — these colours, these names. Versioned here, stamped
#     on every artifact, and what a tag means.
#   * The compiler that produced it. Versioned in Cargo.toml's
#     [workspace.package], and it appears in `cargo xtask --version` and
#     nowhere a consumer looks.
#
# They were one number until 0.2.0, and one number cannot say both "the
# compiler was refactored" and "a colour moved". Only the second is a reason
# for anyone to upgrade, and only the second is bound by TOKEN-POLICY.md.
#
# Bumping: `cargo xtask release <version>` writes this and package.json
# together. `--tool <version>` bumps the compiler instead.
[system]
version = "0.2.1"

# The name and one-line description carried into generated package metadata —
# the npm package, the generated Rust crate, and MANIFEST.json — so those
# describe the colour system rather than the tool that emitted it.
name = "noctua-colors"
description = "A generated colour system: 39 palettes and 1,767 semantic names, solved in OKLCH against APCA contrast targets rather than hand-picked."

[output]
# The gamut relative chroma resolves against, and the one the hex fallback
# layer is written in. Everything a browser or a QML file falls back to.
gamut = "srgb"

# Wider gamuts emitted as extra layers. The same token comes out more
# saturated in each, because its relative chroma resolves against more room —
# without being redefined anywhere.
upgrades = ["display-p3"]

# Namespace for emitted custom properties: `nc` produces `--nc-accent-solid`
# and `--nc-color-surface`. Everything this project emits carries it — including
# the semantic layer, which used to be bare `--color-*`. Only the Tailwind
# target emits that namespace, because Tailwind v4 fixes it and nothing can
# rename it; a bare layer here would have claimed those names for consumers who
# have never installed Tailwind.
prefix = "nc"


# --- Families -----------------------------------------------------------
#
# A family is a hue and a chroma curve. Lightness is never authored: it is
# solved, per step, from the contrast that step's role asks for.
#
# `cr` is *relative* chroma — a fraction of the most the gamut can show at
# each step's lightness and hue, not an absolute number. That is what keeps a
# yellow and a blue looking equally saturated at the same step despite blue
# having nearly twice the chroma available.
#
# `torsion` shifts hue along the ramp, ends rotating in opposite directions
# about the base. It is what makes a ramp look designed rather than computed.
# Note it follows *ramp position*, not lightness: step 12 is the strongest
# text in both modes, but it is the darkest step in light mode and the
# lightest in dark mode, so the same torsion reads as warmer-in-shadow in one
# and warmer-in-highlight in the other.

[families.accent]
# The house ochre. Torsion pulls the deep end slightly red and the light end
# slightly gold, which is how a warm neutral-adjacent hue stays warm instead
# of going muddy as it darkens.
hue = { base = 59.3, torsion = -7.0 }
cr = { ends = [0.12, 0.40], peak = 0.88 }

[families.danger]
hue = { base = 30.8, torsion = -5.0 }
# Semantic families are pushed apart in lightness, because hue is precisely the
# axis a red-green dichromat is missing: unshifted, success and danger collapse
# to 0.038 apart under deuteranopia against 0.234 for normal vision.
#
# These values are the measured optimum, not a guess. Searched subject to every
# hard requirement — fills stay visible, ramps stay sane, text stays readable —
# they roughly double the worst-case separation, from 0.0078 to 0.0163.
#
# That is still under one just-noticeable difference, and no other choice does
# better. Six semantic colors cannot be made mutually distinguishable under all
# three dichromacies by color alone; the gate reports the margin so the number
# is visible rather than assumed. Pair these with an icon or a label.
contrast_shift = 12.0

[families.warning]
hue = { base = 89.7 }
contrast_shift = -10.0
# Yellows run out of room early: they are inherently light, so a dark yellow
# is a dark olive rather than a dark yellow. Pulling the deep end back keeps
# the ramp honest instead of muddy.
cr = { ends = [0.14, 0.30], peak = 0.95 }

[families.success]
hue = { base = 144.0, torsion = 6.0 }
contrast_shift = -2.0

[families.info]
hue = { base = 232.0, torsion = -8.0 }
contrast_shift = -6.0
# Oklab drifts blues toward purple as they darken at high chroma. This is the
# corrective term for that — a defect of the color space, deliberately kept in
# a separate field from `torsion`, which is intent. Merging them would make
# "was this on purpose?" unanswerable in a year.
hue_correction = [[0.25, 4.0], [0.55, 6.5], [0.85, 2.0]]

# The four families below exist because their contexts have to be told apart
# from every other context *without a legend* — `waiting` beside `active` in a
# job list, `urgent` beside `danger` in an alert feed. Every other context in
# `[semantic]` is an alias, because a family costs a full twelve-role ramp in
# every theme, mode and gamut — about 3.5 MiB — while an alias costs 15 KiB.
# The ratio is 244 to 1, and it is the whole reason there are ten families and
# not forty.
#
# Their hues are what the wheel had left. Sixteen hues were already occupied
# (five semantic families and twelve accents), which averages 22.5 degrees of
# spacing, and the 158–172 protanopia dead zone is unusable. Measured, only
# three gaps were wide enough to sit 14 degrees clear of both neighbours: 45,
# 74.5 and 264. The other two hues below are 12.5 and 9 degrees from the
# nearest *accent* — deliberately, because an accent is chosen by whoever
# installs the palette and a status colour is not, so the accent gives way.
# Separation from another semantic family is the constraint that holds.

[families.urgent]
# A red-orange between danger and warning, which is what "act now" is. The
# nearest semantic family is danger, 14.2 degrees away, and hue is not what
# separates them — `contrast_shift` is.
hue = { base = 45.0, torsion = -5.0 }
contrast_shift = 6.0

[families.waiting]
# A yellow-green: past warning, not yet success. 27.8 degrees from warning and
# 26.5 from success, the widest either allows.
hue = { base = 117.5, torsion = 4.0 }
# Measured: -10 and below collapse `border-strong` onto `solid` — 0.0096 apart,
# under the just-noticeable difference — because a yellow-green's solid target
# falls onto the same lightness the border is anchored to. -8 is the largest
# magnitude that keeps every step distinct.
contrast_shift = -8.0

[families.active]
# A cyan, above the protanopia dead zone. Chosen at 203 rather than 190 so it
# clears the zone by 31 degrees rather than 18 — a hue that close to the zone
# edge inherits some of its problem.
hue = { base = 203.0, torsion = 5.0 }
contrast_shift = 4.0

[families.progress]
# The widest remaining gap on the whole wheel: 264 sits 14 degrees from both
# the blue and the indigo accents, and 32 from info.
hue = { base = 264.0, torsion = -6.0 }
# Thirty-two degrees of blue is not much, and tritanopia is the deficiency that
# removes exactly that axis: at -8 this family and `info` measured 0.0132 apart
# under tritanopia, below the 0.015 floor — the same colour. Lightness is the
# only lever left, and -14 takes the pair to 0.0487.
#
# It is pinched from the other side, and by *both* modes at once. This is the
# only family whose shift is large enough to move its `solid` past its own
# `border-strong` — below it in dark mode, above it in light — so the two walk
# together whichever way the shift moves, and the window is narrow. Measured at
# -11 the light-mode pair collapses to 0.0075 and at -8 the tritanopia
# separation falls to 0.0139, both under their floors. -14 keeps 0.0148 and
# 0.0487. Re-measure both before touching this number, and both modes.
contrast_shift = -14.0
hue_correction = [[0.25, 3.5], [0.55, 5.5], [0.85, 1.5]]


# --- Semantic contexts --------------------------------------------------
#
# Slot on the left, family on the right. A slot named after a family is mapped
# to it automatically, so only the names that differ appear here.
#
# Declared once rather than per theme: with thirty-nine palettes, repeating
# three hundred aliases in each would be the largest and least informative part
# of this file. A `[themes.<name>.semantic]` block still overrides one palette,
# and only what it overrides is written per theme — everything below is emitted
# once, into `system/css/contexts.css` and its equivalents.
#
# Every slot emits five tokens — `--nc-color-rejected`, `-hover`, `-bg`,
# `-border`, and `--nc-color-on-rejected`.
#
# **Every one of these is an alias, and that is the whole design.** A family
# costs a full twelve-role ramp in every theme, mode and gamut; an alias costs
# five `var()` references, written once. Ten families carry three hundred and
# fifty contexts because the wheel has room for ten hues and not for three
# hundred and fifty — see the note above `[families.urgent]`. A context earns a
# family only when its meaning has to be told apart from every other *without a
# legend*, and none of the ones below does.
#
# The groups are how a reader looks a name up, so they are by subject rather
# than by family. Within a group the aliases are ordered by family, because
# what a reader checks next is which other names share a colour.

[semantic]
# Done, and done well.
positive = "success"
finished = "success"

# Done, and not well. `error` is the name most codebases already use; `danger`
# is the name the family has, because it is also the colour of a destructive
# button that has not been pressed yet.
error = "danger"
negative = "danger"
rejected = "danger"
declined = "danger"

# Late is a kind of warning, not a kind of urgent: it needs attention, but the
# thing has not gone wrong yet.
delayed = "warning"

# The default state of anything. Deliberately the same blue as `info` — a
# system that gives "normal" its own colour has coloured the background noise.
normal = "info"

# Things the brand points at. `new` is not a Rust or CSS problem but it is a
# JavaScript reserved word, so the QML target emits it as `new_`.
highlight = "accent"
new = "accent"
experimental = "accent"

# States that are the absence of a state. Gray on purpose: nothing here should
# compete with a real status for attention.
inactive = "neutral"
draft = "neutral"
archived = "neutral"
paused = "neutral"

# In flight, in both directions.
sent = "progress"
received = "progress"

# Severity and emphasis.
# How loud a message is, from `fatal` down to `debug`. `default` is
# deliberately the same blue as `normal` and `info`: a system that gives
# "nothing special" its own colour has coloured the background noise.
critical = "danger"
fatal    = "danger"
severe   = "danger"
failed   = "danger"
failing  = "danger"
alert    = "urgent"
major    = "urgent"
caution  = "warning"
minor    = "warning"
default  = "info"
notice   = "info"
hint     = "info"
tip      = "info"
subtle   = "neutral"
silent   = "neutral"
debug    = "neutral"
disabled = "neutral"

# Lifecycle of a job.
# A job, from queued to finished. The four families that exist only for
# this — waiting, active, progress, urgent — are why: `queued` beside
# `running` beside `stalled` has to be readable without a legend.
pending      = "waiting"
queued       = "waiting"
scheduled    = "waiting"
standby      = "waiting"
idle         = "waiting"
loading      = "progress"
initializing = "progress"
starting     = "progress"
stopping     = "progress"
retrying     = "progress"
processing   = "progress"
recovering   = "progress"
running      = "active"
busy         = "active"
ready        = "active"
resumed      = "active"
stopped      = "neutral"
skipped      = "neutral"
partial      = "neutral"
stalled      = "urgent"
blocked      = "urgent"
timeout      = "urgent"
expired      = "urgent"
retried      = "urgent"
complete     = "success"
done         = "success"
resolved     = "success"
restored     = "success"
canceled     = "danger"
aborted      = "danger"
terminated   = "danger"
unresolved   = "warning"

# Work items: issues, reviews, tickets.
# Issues, reviews and tickets. `open` is informational rather than a
# warning: most things are open, and colouring the common case makes the
# uncommon one invisible.
open        = "info"
reopened    = "info"
answered    = "info"
duplicate   = "info"
needsinfo   = "info"
closed      = "neutral"
dismissed   = "neutral"
wontfix     = "neutral"
ignored     = "neutral"
unanswered  = "neutral"
merged      = "success"
solved      = "success"
approved    = "success"
accepted    = "success"
submitted   = "waiting"
resubmitted = "waiting"
review      = "waiting"
appealed    = "waiting"
escalated   = "urgent"
disputed    = "urgent"
flagged     = "urgent"
reported    = "urgent"
withdrawn   = "danger"
revoked     = "danger"
suspended   = "danger"
banned      = "danger"
conflict    = "warning"

# Access and visibility.
# What may be reached, and by whom. Locked is grey rather than red:
# a locked record is a normal state, not a problem.
locked       = "neutral"
unlocked     = "neutral"
frozen       = "neutral"
hidden       = "neutral"
private      = "neutral"
internal     = "neutral"
restricted   = "neutral"
readonly     = "neutral"
editable     = "neutral"
enabled      = "success"
visible      = "success"
public       = "success"
shared       = "success"
external     = "success"
authorized   = "success"
forbidden    = "danger"
unauthorized = "danger"

# Connectivity and service health.
# Reachability and service health. `degraded` warns and `outage`
# alarms — the pair is the difference between slow and gone.
online       = "active"
connected    = "active"
live         = "active"
realtime     = "active"
offline      = "neutral"
disconnected = "neutral"
dormant      = "neutral"
lapsed       = "neutral"
reconnecting = "progress"
unreachable  = "danger"
outage       = "danger"
degraded     = "warning"
unstable     = "warning"
unhealthy    = "warning"
maintenance  = "info"
healthy      = "success"
stable       = "success"
operational  = "success"

# Release maturity.
# How finished a thing is. The unreleased end takes the brand, because a
# preview is something to point at; the retired end is grey, because it
# is not.
alpha        = "accent"
beta         = "accent"
preview      = "accent"
canary       = "accent"
nightly      = "accent"
prerelease   = "accent"
launched     = "accent"
deprecated   = "warning"
outdated     = "warning"
downgraded   = "warning"
legacy       = "neutral"
obsolete     = "neutral"
retired      = "neutral"
discontinued = "neutral"
unreleased   = "neutral"
reverted     = "neutral"
rollback     = "neutral"
unsupported  = "danger"
supported    = "success"
updated      = "success"
upgraded     = "success"
migrated     = "success"
released     = "success"
restocked    = "success"
migrating    = "progress"
staged       = "progress"

# Build, test, deploy.
# Build, test, deploy. The verb forms are in flight and the past
# participles have landed, which is the whole distinction these carry.
deploying   = "progress"
building    = "progress"
testing     = "progress"
installing  = "progress"
updating    = "progress"
syncing     = "progress"
uploading   = "progress"
downloading = "progress"
deployed    = "success"
built       = "success"
tested      = "success"
passing     = "success"
installed   = "success"
synced      = "success"
uploaded    = "success"
downloaded  = "success"
verified    = "success"
validated   = "success"
valid       = "success"
confirmed   = "success"
invalid     = "danger"
uninstalled = "neutral"
unsynced    = "neutral"
unverified  = "neutral"
unconfirmed = "neutral"

# Commerce, catalogue and fulfilment.
# Catalogue, payment and fulfilment. Money that has not arrived warns
# rather than alarms until it is actually reversed.
featured    = "accent"
pinned      = "accent"
starred     = "accent"
favorite    = "accent"
bookmarked  = "accent"
recommended = "accent"
popular     = "accent"
trending    = "accent"
top         = "accent"
limited     = "accent"
exclusive   = "accent"
premium     = "accent"
pro         = "accent"
free        = "info"
trial       = "info"
quoted      = "info"
invoiced    = "info"
billed      = "info"
expiring    = "warning"
overdue     = "warning"
unpaid      = "warning"
backordered = "warning"
renewed     = "success"
paid        = "success"
settled     = "success"
captured    = "success"
delivered   = "success"
available   = "success"
preorder    = "success"
chargeback  = "danger"
voided      = "danger"
refunded    = "danger"
undelivered = "danger"
unavailable = "danger"
shipped     = "progress"
transit     = "progress"
dispatched  = "progress"
packing     = "progress"
ordered     = "progress"
returned    = "progress"
reserved    = "waiting"
booked      = "waiting"
occupied    = "waiting"
vacant      = "neutral"
unclaimed   = "neutral"
unassigned  = "neutral"
unselected  = "neutral"

# Assignment and inbox.
# Who has it, and what has been looked at. `read` is grey on
# purpose: an inbox where everything is coloured has no unread state.
assigned  = "active"
