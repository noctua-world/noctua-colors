# People and roles.
# Accounts and roles. Elevated roles take the brand, because they are a
# capability rather than a state.
onboarding  = "progress"
offboarding = "progress"
anonymous   = "neutral"
guest       = "neutral"
deactivated = "neutral"
silenced    = "neutral"
member      = "info"
returning   = "info"
admin       = "accent"
owner       = "accent"
moderator   = "accent"


# --- Neutral ------------------------------------------------------------

[neutral]
# Grays are tinted toward the brand, not dead. Two or three percent is below
# the threshold of being read as "a color" and well above the threshold of
# sitting comfortably beside one. Set `achromatic = true` for a true gray.
tint_hue = 59.3
tint_strength = 0.030

# Two more temperatures beside the brand-tinted gray. Naming a hue is what asks
# for the variant; leaving it out emits neither.
#
# These do *not* follow the accent, unlike `tint_hue` — the point of a cool gray
# is to be a different temperature from the brand, so following the brand would
# collapse it onto the base ramp. They are fixed, and every palette gets the
# same two.
#
# These carry far more chroma than the base, and they have to. The distance
# between two tints is bounded by roughly the sum of their chromas, so at the
# base's 3% — an absolute chroma of about 0.004 — no hue placement can separate
# anything: the first version of this block used 0.030 and 0.022 and produced
# three ramps that were mutually indistinguishable, `gray-warm` byte-identical
# to `gray` at most steps. Hue is not the lever here; chroma is.
#
# The strengths are unequal, and the direction is the opposite of what it looks
# like it should be: **warm needs more than cool.** The base tint is itself warm
# (hue 59.3), so a warm variant's chroma partly cancels against it — 17 degrees
# apart, the radii subtract — while cool sits 191 degrees away and the radii add.
# Equal appearance therefore costs unequal chroma.
#
# Warm is at 42 rather than beside the base: at 58 it was 1.3 degrees from
# `tint_hue`, which is the same hue, and the two ramps could only have differed
# by how much of it they carried. 42 is a taupe, and clears `danger` at 30.8.
#
# Measured at these values, peak separation across the ramp: `gray` to
# `gray-cool` 0.0328, `gray` to `gray-warm` 0.0289, and the two temperatures
# 0.0583 apart — well over one just-noticeable difference from the base and
# nearly three from each other. `noctua_check::spacing` gates it at 0.025 and
# reports the margin, so this cannot quietly collapse again.
#
# The margin above that gate is deliberate. An earlier pass landed both pairs on
# 0.0300 against a gate of 0.03, which warned on a floating-point hair and would
# have flipped with any change to the gamut solver or the quantization.
#
# The separation peaks mid-ramp and fades at both ends, and no setting changes
# that: the gamut allows a maximum chroma of 0.0060 at step 24 and 0.0236 at
# step 1, so the extremes cannot hold a tint however much is asked for. The
# temperature lives in the mid-tones — borders and muted text — while surfaces
# stay near-neutral.
cool_hue = 250.0
cool_tint_strength = 0.16
warm_hue = 42.0
warm_tint_strength = 0.165

# The dense ramp, separate from the twelve functional roles and emitted once
# for both modes. Interfaces need far finer gray resolution than twelve steps.
steps = 24

# Where those steps go. Light-mode surfaces all live just below white and
# dark-mode surfaces just above black; the middle is mostly borders. Spreading
# evenly would waste most of the ramp and run out exactly where fine
# discrimination is needed.
density = [
  { range = [0.10, 0.25], weight = 3.0 },
  { range = [0.85, 0.99], weight = 3.0 },
]


# --- Palettes -----------------------------------------------------------
#
# Two axes. A palette is one accent hue crossed with one saturation, so twelve
# accents and three saturations describe thirty-six palettes in fifteen lines.
# The alternative is thirty-six near-identical `[themes.*]` blocks in which the
# two axes exist only as a naming convention.
#
# Order matters: the first accent crossed with the first saturation is the
# default palette, the one the emitted CSS binds to `:root`.

[accents]
# Every hue here sits at least 14 degrees from every semantic family — danger
# 30.8, warning 89.7, success 144.0, info 232.0 — so a chosen accent is never
# mistakable for a status colour. Spacing is therefore deliberately uneven:
# these are thirteen named choices, not a generated scale.
#
# One band is missing on purpose. Measured by sweeping the arc in 2.5-degree
# steps, an accent between roughly 158 and 172 degrees collapses onto `danger`
# under protanopia — worst at 165, where the two sit 0.0018 apart, far inside a
# just-noticeable difference. Since 130 to 158 is already excluded by the
# success family, the greens above lime are unusable, and the range from jade
# onward is teal rather than green. This is why there is one green here and
# three blue-greens.
#
# `hue_correction` appears only on the hues that need it. Oklab drifts blues
# toward purple as they darken at high chroma; a green does not have that
# problem, and giving it a blue's correction would introduce one.

# The house ochre, unchanged, and the default.
ochre   = { hue = { base = 59.3, torsion = -7.0 } }
amber   = { hue = { base = 105.0, torsion = -5.0 } }
lime    = { hue = { base = 130.0, torsion = 4.0 } }
jade    = { hue = { base = 176.0, torsion = 5.0 } }
teal    = { hue = { base = 194.0, torsion = 5.0 } }
azure   = { hue = { base = 212.0, torsion = -6.0 }, hue_correction = [[0.25, 3.0], [0.55, 5.0], [0.85, 1.5]] }
blue    = { hue = { base = 250.0, torsion = -8.0 }, hue_correction = [[0.25, 4.0], [0.55, 6.5], [0.85, 2.0]] }
indigo  = { hue = { base = 278.0, torsion = -6.0 }, hue_correction = [[0.25, 3.0], [0.55, 4.5], [0.85, 1.5]] }
violet  = { hue = { base = 300.0, torsion = -4.0 } }
magenta = { hue = { base = 325.0, torsion = -3.0 } }
rose    = { hue = { base = 350.0, torsion = -4.0 } }
clay    = { hue = { base = 15.0, torsion = -6.0 } }
# The one brown, and the one accent whose `cr` is its own. That curve is what
# makes it brown rather than a second ochre: at the default curve this hue is an
# orange, and hue alone cannot separate the two — swept from 38 to 50, the
# distance from `ochre` moved by 0.004 while dropping the chroma peak from 0.55
# to 0.42 moved it by 0.006 at every hue. Same lesson as the neutral
# temperatures: chroma is the lever, hue only decides which colour.
#
# The `solid` step is a mocha rather than a chocolate, and no setting changes
# that — its lightness is fixed by the contrast contract, Lc 58 against the
# page, so it lands near L 0.66 whatever the hue. The brown lives in the deep
# steps: #836252 and #36261f against ochre's #83634c and #33271f.
#
# 50 is 9 degrees from `ochre` and 5 from the `urgent` family, inside the 14 the
# other accents keep. The rule uses degrees as a proxy for confusability and the
# proxy fails safe here, because `umber` carries about half their chroma — so
# the separation is measured rather than assumed. Worst case across all three
# saturations and both modes: **0.0264 from ochre, 0.0539 from urgent, 0.0480
# from clay, 0.0770 from danger**, against a just-noticeable difference of 0.02.
# The tightest is `umber-sober` against `ochre-sober`, where both saturations
# pull toward the same muted warm.
umber   = { hue = { base = 50.0, torsion = -6.0 }, cr = { ends = [0.07, 0.42], peak = 0.42, peak_at = 0.55 } }

[saturations]
# The sober-to-vivid axis. Measured: the house look sits at 61% of the chroma
# sRGB allows at the accent's lightness and hue, so `balanced` is a little
# under one.
balanced = 0.82
vivid = 1.15
sober = 0.55


# --- Categorical scales --------------------------------------------------
#
# The default set is `[chart]`; every other is a `[[charts]]` block with a name.
# They are all built the same way and differ only in where they start, how many
# entries they have, and whether they admit to needing a legend.

[chart]
# Six rather than eight. Eight generated colours cannot be kept apart under
# all three dichromacies — measured, the closest pair collapses to 0.042 —
# while six hold at 0.072. Raise it if a chart needs more; the gate will warn,
# and the answer then is to label the series rather than rely on colour.
count = 6
# Equal hue angles are not equal to the eye: a rotation through the greens
# changes appearance far less than the same rotation through the blues.
# This spaces entries by perceptual difference instead.
spread = "even-delta-e"
cr = 0.80

# Entries span this much lightness. Hue alone cannot separate a categorical
# scale for a dichromat: hue is the axis their vision is missing.
lightness_spread = 0.60

[[charts]]
# The same six, starting from the opposite side of the wheel. Two sets on one
# page — actual against forecast, this quarter against last — need to be told
# apart from each other as well as within themselves, and starting `chart` twice
# would produce two sets of the same six colours.
#
# `hue_start` is absolute here rather than inherited: the default set leads with
# whichever accent the palette was installed with, so a second set defined as an
# offset from it would move whenever the accent did, and its relationship to
# the first would be the only thing that stayed fixed.
name = "chart-alt"
hue_start = 205.0
count = 6
spread = "even-delta-e"
cr = 0.80
lightness_spread = 0.60

[[charts]]
# Twelve, and the reason `labelled` exists.
#
# Colour alone does not separate twelve entries under all three dichromacies,
# and no arrangement of hue and lightness changes that — six is roughly where a
# generated set runs out. This one goes past it on purpose, for the case where
# the legend names every series and colour is the secondary channel rather than
# the only one. The gate still measures every pair and still fails on any two
# that land inside a just-noticeable difference; what `labelled` changes is that
# the shortfall is reported as the measured limit it is, once per deficiency,
# instead of as sixty-six warnings advising a different choice that does not
# exist. Measured here: **0.0331 at the closest pair**, against a floor of 0.02
# and a target of 0.05.
#
# **The lightness centres are the load-bearing setting, not the spread, and
# neither is smooth.** Entries are placed at `centre ± spread/2` and then
# clamped into 0.08 to 0.95, so a band that runs off the top does not stop — it
# piles up, and the entries that pile up are separated by hue alone, which is
# what dichromacy removes. At the default dark centre of 0.70 with a spread of
# 0.70 the last pair came out **0.0009 apart under tritanopia**: the same
# colour.
#
# Lowering the centres fixes that, but the response is nowhere near monotone,
# because `chart::hues` places hue by arc length on *one* lightness slice while
# lightness is placed by index — move the slice and the hue spacing moves with
# it. Measured across the neighbourhood, at count 12 and spread 0.62: centres
# 0.60/0.66 give 0.0229, 0.62/0.66 give 0.0298, 0.64/0.66 give 0.0331. Holding
# the centres and moving the spread instead barely helps — 0.60 and 0.64 give
# 0.0261 and 0.0282 against 0.62's 0.0298. **Re-measure rather than
# interpolate**; the surface has no slope worth following.
name = "chart-wide"
labelled = true
count = 12
spread = "even-delta-e"
cr = 0.80
lightness_light = 0.64
lightness_dark = 0.66
lightness_spread = 0.62

[[charts]]
# Three entries, well clear of each other, for the chart that has three series
# and does not need a legend at all. Fewer entries means more room, so this is
# the one categorical set with margin to spare — measure it and it should stay
# far above the target where the others sit near it.
name = "chart-trio"
count = 3
spread = "even-delta-e"
cr = 0.80
lightness_spread = 0.44


# --- Ordered scales -----------------------------------------------------
#
# A scale is a hue path plus the stops along it. It differs from `[chart]` in
# what it is for, and therefore in how it is built: a chart spreads hues *around
# the wheel* so a legend can tell six series apart, while a scale walks a hue
# *path* so a reader can tell which of two stops is worse without a legend.
#
# Both scales below are traffic lights, green through yellow to red, and both
# ascend into red: `level-10` and `higher` are the bad end. Reversing that is
# one edit — reverse the hue knots.
#
# `even = true` (the default) places stops at equal *perceptual* distance along
# the path rather than at equal `t`. It matters here: a hue path crosses Oklab
# at very uneven rates, and spacing evenly in `t` compresses the yellow middle
# against the red end badly enough to see.

[[scales]]
# Eleven stops, `level-0` through `level-10`. Counted stops number from zero,
# which is what a level scale means by its first stop.
name = "level"
hue = { knots = [[0.0, 144.0], [0.5, 89.7], [1.0, 30.8]] }
stops = 11
# Higher than a family's curve. These stops are read against each other, not
# used as surfaces or text, so there is no reason to mute the ends.
cr = { ends = [0.70, 0.80], peak = 0.92, peak_at = 0.5 }
# Eleven stops on one 113-degree arc cannot be separated by hue alone, and under
# dichromacy they cannot be separated by hue at all. Lightness is what makes the
# scale still read as ordered, so it spans more here than a five-stop scale
# needs.
#
# **Negative on purpose**, and this is a measured result rather than taste. A
# negative spread descends: `level-0` is the lightest stop and `level-10` the
# darkest. Ascending instead, the worst neighbouring pair came out 0.0185 apart
# under protanopia — inside the just-noticeable difference, two stops read as
# one. The cause is that protanopia darkens reds sharply, so an ascending ramp
# has the deficiency working against it, cancelling most of each step at the red
# end. Descending, the same darkening *adds* to the ramp, and the worst pair
# goes to 0.0447. Same eleven colours, opposite sign, more than twice the
# separation where it is scarcest.
lightness_spread = -0.50

[[scales]]
# The same path, five named stops. Independent of `level` on purpose: a form
# that offers five choices should not have to explain that they are levels 0,
# 2, 5, 8 and 10.
name = "magnitude"
hue = { knots = [[0.0, 144.0], [0.5, 89.7], [1.0, 30.8]] }
stops = ["lower", "low", "medium", "high", "higher"]
cr = { ends = [0.70, 0.80], peak = 0.92, peak_at = 0.5 }
# Descending, for the same measured reason as `level` above.
lightness_spread = -0.34


# --- Consumers ----------------------------------------------------------
#
# Where `cargo xtask export` copies generated output. Add three lines per
# project; nothing else needs configuring.

[[consumers]]
name = "docs-site"
path = "docs-site/vendor/tokens"
targets = ["css", "json-ts"]

# The design system. Its path is relative to this repository, so it resolves
# only inside the workspace layout — which is the layout every agent and every
# developer is required to use (see AGENTS.md, and NOCTUA.md §3).
#
# It takes four targets and not the rest: `css` and `tailwind` are what the
# components and the docs site style against, `json-ts` feeds the docs site's
# palette browser, and `rust` is what the Dioxus package compiles in. It does
# not take `scss`, `qml`, `dtcg` or `reports` — nothing there consumes them, and
# an unused target is payload plus review surface.
#
# Until noctua-design exists (NOCTUA-PLAN.md Stage 3), `cargo xtask export`
# reports this consumer and writes nothing new; the directory is created on the
# first real export.
[[consumers]]
name = "noctua-design"
path = "../noctua-design/packages/tokens/vendor"
targets = ["css", "tailwind", "json-ts", "rust"]
