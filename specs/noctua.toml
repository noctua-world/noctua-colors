checked       = "success"

# Capacity and performance.
# Load and throughput. The restraints — throttled, quarantined — are
# urgent rather than danger: something is being held back, not broken.
quarantined = "urgent"
isolated    = "urgent"
throttled   = "urgent"
ratelimited = "urgent"
overloaded  = "urgent"
congested   = "urgent"
sandboxed   = "neutral"
