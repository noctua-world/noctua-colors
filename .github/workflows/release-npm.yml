# Publishes @noctua-world/colors when a version tag is pushed.
#
# There is no NODE_AUTH_TOKEN here, and that is the entire point: npm trusted
# publishing exchanges the workflow's OIDC identity for a short-lived credential,
# so there is no long-lived secret to leak. npm's classic tokens were revoked in
# December 2025 and granular tokens lose publish rights in January 2027, so this
# is also the only path with a future.
#
# The filename is part of the configuration. npm's trusted publisher is
# registered against `release-npm.yml` by name — renaming this file silently
# breaks publishing, and the error does not mention the filename.
name: Publish to npm

on:
  push:
    tags: ["v*.*.*"]

# Read-only by default; each job asks for what it needs.
permissions: {}

jobs:
  publish:
    name: npm publish
    # Must be a GitHub-hosted runner. Trusted publishing and provenance both
    # refuse self-hosted runners.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC, for both trusted publishing and the provenance attestation.
      # Without it nothing here works.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1, which is newer than what some
      # Node images ship.
      - name: Use a recent npm
        run: npm install -g npm@latest

      # The tag has to match what is about to be published, or a mistyped tag
      # publishes the wrong version under the right name — and npm publishes are
      # permanent.
      - name: The tag and package.json must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json $pkg"
            exit 1
          fi
          echo "publishing $pkg"

      # Asserts the tarball is the curated set and not the whole 79 MB tree.
      # `cargo xtask check` verifies every claim in package.json without Node;
      # this verifies what npm will actually put in the tarball.
      - name: What is in the tarball
        run: |
          npm pack --dry-run
          node -e '
            const p = require("child_process").execSync("npm pack --dry-run --json");
            const parsed = JSON.parse(p);
            // npm 11 returns an array of one entry; npm 12 returns an object
            // keyed by package name. The fields inside are identical — only the
            // envelope changed. This step ran the CLI the workflow installs
            // (`npm@latest`), not the one on the developer machine, so the
            // difference showed up here and nowhere else.
            const { files, unpackedSize } =
              Array.isArray(parsed) ? parsed[0] : Object.values(parsed)[0];
            const leaked = files.filter(f =>
              /^system\/(ts|rust|qml|reports)\//.test(f.path) ||
              /^system\/json\/(palette|themes)/.test(f.path));
            if (leaked.length) {
              console.error("::error::excluded paths in the tarball:", leaked.map(f => f.path));
              process.exit(1);
            }
            // A ceiling, not a target. It exists to catch the whole 79 MB tree
            // leaking in, which is what happens when `files` is deleted or a
            // path is mistyped — not to police ordinary growth.
            //
            // Raised from 20 to 32 MiB in 0.2.0, when the 39 per-palette
            // stylesheets and their Tailwind entries took the package from
            // 13.5 to 22.2 MiB. That is a deliberate trade: the whole point of
            // those files is that a consumer downloads *one* of them, so the
            // package is bigger and every real install is far smaller.
            const limit = 32 * 1024 * 1024;
            if (unpackedSize > limit) {
              console.error(`::error::unpacked ${unpackedSize} exceeds ${limit}`);
              process.exit(1);
            }
            console.log(`unpacked ${(unpackedSize / 1048576).toFixed(1)} MiB, ${files.length} files`);
          '

      # Publishing the same version twice is an error, and there are two ordinary
      # ways to arrive here having already published: the bootstrap release,
      # which must be done by hand because npm has no pending-publisher and a
      # trusted publisher cannot be configured for a package that does not exist
      # yet; and a re-run after a transient failure. Neither deserves a red X.
      #
      # The check is a fast path, not the decision. `npm view` reads the
      # packument through a CDN that lags the write path by minutes — observed
      # during the bootstrap publish, where `npm view` returned 404 while
      # `npm access get status` reported the package public and a PUT was
      # rejected for already existing. So "not readable" must never be trusted to
      # mean "not published": the registry's answer to the actual publish is the
      # only authority, and that is what the second branch reads.
      #
      # `--provenance` as well as publishConfig.provenance: the docs say OIDC
      # makes it automatic, practitioners report otherwise, and setting both
      # costs nothing.
      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@noctua-world/colors@${version}" version >/dev/null 2>&1; then
            echo "::notice::@noctua-world/colors@${version} is already published; nothing to do"
            exit 0
          fi

          set +e
          out="$(npm publish --provenance --access public 2>&1)"
          status=$?
          set -e
          echo "$out"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if echo "$out" | grep -qi 'cannot publish over'; then
            echo "::notice::${version} was already on the registry; the read path had not caught up"
            exit 0
          fi
          exit "$status"
