# Publishes noctua-colors-tokens and noctua-colors when a version tag is pushed.
#
# Like the npm workflow, there is no stored token: crates.io trusted publishing
# exchanges OIDC for a credential that lives about thirty minutes, and the
# auth action's post step revokes it when the job ends.
#
# The filename is part of the configuration — crates.io registers the trusted
# publisher against `release-crate.yml` by name.
name: Publish crates

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml decides the version and components; nothing is
      # named twice.
      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: The tag and the workspace version must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ws="$(grep -A5 '^\[workspace.package\]' Cargo.toml | grep '^version' | cut -d'"' -f2)"
          if [ "$tag" != "$ws" ]; then
            echo "::error::tag v$tag does not match the workspace version $ws"
            exit 1
          fi
          echo "publishing $ws"

      # The whole gate, before anything irreversible. A crates.io publish cannot
      # be undone — `cargo yank` only stops *new* dependents.
      - run: cargo xtask check

      # Same reasoning as the npm workflow: the bootstrap release is published by
      # hand, because crates.io has no pending-publisher either, and a re-run
      # after a transient failure is ordinary. A crates.io publish is permanent —
      # `cargo yank` only stops new dependents — so "already there" is the one
      # outcome worth skipping rather than retrying.
      - name: Which versions are already on the registry?
        id: existing
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Output names deliberately avoid hyphens. In a GitHub Actions
          # expression, `outputs.noctua-colors-tokens` parses the hyphens as
          # subtraction, so the condition silently evaluates to something falsy
          # and the publish is skipped forever. Bracket notation would also work;
          # underscores are harder to get wrong.
          check() {
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: noctua-colors release workflow' \
              "https://crates.io/api/v1/crates/$1/${version}")"
            if [ "$code" = "200" ]; then
              echo "$2=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$1 ${version} is already published; skipping"
            else
              echo "$2=false" >> "$GITHUB_OUTPUT"
            fi
          }
          check noctua-colors-tokens tokens
          check noctua-colors facade

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # `--manifest-path` is mandatory: from the repository root, `cargo publish`
      # would try to publish a root workspace member, which this is not. The
      # generated crate declares its own empty `[workspace]` and the root
      # excludes it, so it is deliberately outside the workspace graph.
      #
      # `--locked` so the published crate is built from the committed lockfile
      # rather than whatever resolves today.
      - name: noctua-colors-tokens
        if: steps.existing.outputs.tokens == 'false'
        run: cargo publish --manifest-path dist/rust/Cargo.toml --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # The facade crate, which holds the project's name. It has no dependants,
      # so a failure here must not look like a failure to ship the tokens —
      # hence the separate step and the ordering.
      - name: noctua-colors
        if: steps.existing.outputs.facade == 'false'
        run: cargo publish -p noctua-colors --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
