# Publishes noctua-colors-tokens and noctua-colors when a version tag is pushed.
#
# Like the npm workflow, there is no stored token: crates.io trusted publishing
# exchanges OIDC for a credential that lives about thirty minutes, and the
# auth action's post step revokes it when the job ends.
#
# The filename is part of the configuration — crates.io registers the trusted
# publisher against `release-crate.yml` by name.
name: Publish crates

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml decides the version and components; nothing is
      # named twice.
      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # A tag names the **colour system's** version, which since 0.2.0 is a
      # different number from the compiler's. This used to read
      # [workspace.package] — the compiler's — which would now reject every
      # correct tag and accept a wrong one.
      #
      # `package.json` rather than the spec, and `grep` rather than `node`:
      # this is a Rust job with no `setup-node`, and leaning on the runner
      # image's preinstalled node is an undeclared dependency. The first
      # `"version"` in this file is the package's own — it has no dependencies,
      # so there are no nested ones to match by accident.
      #
      # `cargo xtask check`, which runs immediately below, is what proves
      # package.json and the spec agree. This step only has to read one of them.
      - name: The tag and the colour system's version must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          system="$(grep -m1 '"version"' package.json | cut -d'"' -f4)"
          if [ "$tag" != "$system" ]; then
            echo "::error::tag v$tag does not match the colour system version $system"
            exit 1
          fi
          echo "publishing $system"

      # The whole gate, before anything irreversible. A crates.io publish cannot
      # be undone — `cargo yank` only stops *new* dependents.
      - run: cargo xtask check

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # `--manifest-path` is mandatory: from the repository root, `cargo publish`
      # would try to publish a root workspace member, which this is not. The
      # generated crate declares its own empty `[workspace]` and the root
      # excludes it, so it is deliberately outside the workspace graph.
      #
      # `--locked` so the published crate is built from the committed lockfile
      # rather than whatever resolves today.
      # Idempotent, and the tolerance is on the *registry's* answer rather than a
      # prior lookup. crates.io's read path can lag its write path, so "the API
      # does not list this version" is not evidence that publishing will succeed —
      # only the publish itself knows. A crates.io publish is permanent (`cargo
      # yank` only stops new dependents), so "already there" is the one outcome
      # worth skipping rather than retrying.
      - name: noctua-colors-tokens
        run: |
          set +e
          out="$(cargo publish --manifest-path system/rust/Cargo.toml --locked 2>&1)"
          status=$?
          set -e
          echo "$out"
          [ "$status" -eq 0 ] && exit 0
          if echo "$out" | grep -qiE 'already (been )?uploaded|already exists'; then
            echo "::notice::this version is already on crates.io; nothing to do"
            exit 0
          fi
          exit "$status"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # The facade crate, which holds the project's name. It has no dependants,
      # so a failure here must not look like a failure to ship the tokens —
      # hence the separate step and the ordering.
      - name: noctua-colors
        run: |
          set +e
          out="$(cargo publish -p noctua-colors --locked 2>&1)"
          status=$?
          set -e
          echo "$out"
          [ "$status" -eq 0 ] && exit 0
          if echo "$out" | grep -qiE 'already (been )?uploaded|already exists'; then
            echo "::notice::this version is already on crates.io; nothing to do"
            exit 0
          fi
          exit "$status"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
