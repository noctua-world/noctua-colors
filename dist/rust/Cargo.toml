[package]
name = "noctua-colors-tokens"
description = "Generated color tokens from noctua-colors: every palette as const OKLCH and sRGB values, no_std and dependency-free."
version = "0.1.0"
edition = "2021"

# A lower edition than the workspace, deliberately: nothing here needs a
# newer one, and the lowest edition that compiles is the widest set of
# consumers that can depend on it.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/noctua-world/noctua-colors"
homepage = "https://noctua-world.github.io/noctua-colors/"
documentation = "https://docs.rs/noctua-colors-tokens"
keywords = ["design-tokens", "color", "oklch", "theme", "palette"]
categories = ["gui", "graphics", "no-std"]

# Its own workspace root.
#
# Without this the crate cannot be built standalone from inside the
# repository that generated it, and vendoring it into a consumer
# would quietly absorb it into their workspace — inheriting their
# lints, their profiles and their resolver version.
[workspace]

# Deliberately empty. A consumer of tokens should not inherit a
# color-math library.
[dependencies]

# One feature per palette. The default is the first one in the spec,
# which is the palette the CSS binds to `:root`.
#
# A consumer shipping one palette should ask for one:
#
#     noctua-colors-tokens = { path = "...", default-features = false, \
#                              features = ["blue_vivid"] }
#
# `all` is there for a tool that needs every palette, such as a picker.
[features]
default = ["ochre_balanced"]
ochre_balanced = []
ochre_vivid = []
ochre_sober = []
amber_balanced = []
amber_vivid = []
amber_sober = []
lime_balanced = []
lime_vivid = []
lime_sober = []
jade_balanced = []
jade_vivid = []
jade_sober = []
teal_balanced = []
teal_vivid = []
teal_sober = []
azure_balanced = []
azure_vivid = []
azure_sober = []
blue_balanced = []
blue_vivid = []
blue_sober = []
indigo_balanced = []
indigo_vivid = []
indigo_sober = []
violet_balanced = []
violet_vivid = []
violet_sober = []
magenta_balanced = []
magenta_vivid = []
magenta_sober = []
rose_balanced = []
rose_vivid = []
rose_sober = []
clay_balanced = []
clay_vivid = []
clay_sober = []
umber_balanced = []
umber_vivid = []
umber_sober = []
all = ["ochre_balanced", "ochre_vivid", "ochre_sober", "amber_balanced", "amber_vivid", "amber_sober", "lime_balanced", "lime_vivid", "lime_sober", "jade_balanced", "jade_vivid", "jade_sober", "teal_balanced", "teal_vivid", "teal_sober", "azure_balanced", "azure_vivid", "azure_sober", "blue_balanced", "blue_vivid", "blue_sober", "indigo_balanced", "indigo_vivid", "indigo_sober", "violet_balanced", "violet_vivid", "violet_sober", "magenta_balanced", "magenta_vivid", "magenta_sober", "rose_balanced", "rose_vivid", "rose_sober", "clay_balanced", "clay_vivid", "clay_sober", "umber_balanced", "umber_vivid", "umber_sober"]
